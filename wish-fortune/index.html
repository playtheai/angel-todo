<body>
  <header class="topbar">
    <div class="logo"><svg class="logo-clover" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="8" cy="8" r="5"/><circle cx="16" cy="8" r="5"/><circle cx="8" cy="16" r="5"/><circle cx="16" cy="16" r="5"/></g><path d="M13 16c2 4 4 5 8 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Wish Fortune</span></div>
    <div class="date">Lucky draw · two cards</div>
  </header>
  <main>
    <h1 class="sr-only">WISH FORTUNE</h1>
    <aside class="intro"><div class="intro-kicker">How to wish</div><p>이거 다 재미니까 과몰입 금지!</p></aside>
    <div class="counter">18 photos · 2 wishes</div>
    <section class="stage" aria-label="위시 운세 카드 팩">
      <div class="halo" aria-hidden="true"></div><div class="burst" aria-hidden="true"></div>
      <div class="cards" aria-live="polite"><article class="fortune-card" tabindex="0"></article><article class="fortune-card" tabindex="0"></article></div>
      <div class="pack-shell">
        <div class="pack">
          <div class="ripped-edge" aria-hidden="true"></div>
          <div class="tear-strip" aria-hidden="true"></div>
          <div class="bottom-seal" aria-hidden="true"></div>
          <div class="pack-copy">
            <div class="pack-topline"><span>Lucky issue 01</span><span>2 cards</span></div>
            <div><div class="seal" aria-hidden="true"><div class="seal-ring"></div><div class="clover"><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div></div><div class="pack-title">Wish<br>Fortune<small>오늘의 위시 운세</small></div></div>
